# fly.toml app configuration file generated for alba-rag-api on 2026-10-17T11:29:55-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'alba-rag-api'
primary_region = 'gru'

[build]

[env]
  RAG_CORS_ORIGINS = 'https://rag-m2.vercel.app'
  RAG_RATE_LIMIT_PER_MINUTE = '5'
  RAG_RATE_LIMIT_PER_DAY = '20'
  RAG_RATE_LIMIT_GLOBAL_PER_DAY = '300'
  RAG_CACHE_SIZE = '200'
  RAG_CACHE_TTL_SECONDS = '86400'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
